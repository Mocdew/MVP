<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deal Desk{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root { --pico-font-size: 95%; }
    .muted { color: var(--pico-muted-color); }
    .flash { padding: .6rem 1rem; border-radius: .4rem; margin-bottom: 1rem; }
    .flash.success { background: #e6f6ea; color: #14532d; }
    .flash.error { background: #fde8e8; color: #7f1d1d; }
    .thumb { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; }
    .pill { font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; background: var(--pico-muted-border-color); }
    .pill.delivered { background: #d1fae5; color: #065f46; }
    .pill.pending { background: #fef3c7; color: #92400e; }
    td, th { vertical-align: middle; }
    form.inline { display: inline; }
    .stat { text-align: center; }
    .stat strong { display: block; font-size: 1.6rem; }
    .lift-up { color: #047857; } .lift-down { color: #b91c1c; }
  </style>
</head>
<body>
<nav class="container">
  <ul><li><strong><a href="{{ url_for('main.index') }}" class="contrast">Deal Desk</a></strong></li></ul>
  <ul>
    {% if g.user %}
      <li><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
      <li><a href="{{ url_for('deals.index') }}">Deals</a></li>
      <li><a href="{{ url_for('auth.logout') }}" class="secondary">Sign out</a></li>
    {% else %}
      <li><a href="{{ url_for('auth.login') }}" role="button">Sign in with Google</a></li>
    {% endif %}
  </ul>
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
